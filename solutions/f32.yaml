name: "assert upper_case_cstr('Hello\\n') == ('HELLO', '')"
limit: 1000
memory_size: 0x1000

memory_mapped_io:
  0x80: [72, 101, 108, 108, 111, 10, 0]
  0x84: []

reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}:	{instruction:next}	{pc:label}

  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [0] >>> []
      numio[0x84]: [] >>> [72,69,76,76,79]